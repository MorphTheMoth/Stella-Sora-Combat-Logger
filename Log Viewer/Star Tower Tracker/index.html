<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Tower Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div class="page">

    <div class="app-header">
        <h1>Star Tower Tracker</h1>
        <div class="header-actions">
            <span id="liveDot" title="connecting..."></span>
            <span id="dataStatus">loading data...</span>
            <span id="runStats"></span>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" data-tab="runs">Runs</button>
        <button class="tab-btn" data-tab="stats">Stats</button>
        <button class="tab-btn" data-tab="potentials">Potentials</button>
        <button class="tab-btn" data-tab="notes">Notes</button>
        <button class="tab-btn" data-tab="events">Events</button>
        <button class="tab-btn" data-tab="shop">Shop</button>
    </div>

    <div class="tab-panel active" id="panel-runs"></div>
    <div class="tab-panel" id="panel-stats"></div>
    <div class="tab-panel" id="panel-potentials"></div>
    <div class="tab-panel" id="panel-notes"></div>
    <div class="tab-panel" id="panel-events"></div>
    <div class="tab-panel" id="panel-shop"></div>

</div>

<script src="app.js"></script>
<script src="tabs/stats.js"></script>
<script src="tabs/runs.js"></script>
<script src="tabs/potentials.js"></script>
<script src="tabs/notes.js"></script>
<script src="tabs/events.js"></script>
<script src="tabs/shop.js"></script>
<div id="quickSwap">
    <a class="qs-btn" href="/">Logs</a>
    <a class="qs-btn" href="/emblems/">Emblems</a>
</div>
</body>
</html>
