    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #161616; color: #ddd; height: 100vh; display: flex; flex-direction: column; overflow: hidden; align-items: center; }
        .page {
            max-width: 1050px; width: 100%; height: 100%; display: flex;
            flex-direction: column; background: #1a1a1a; margin: 0 auto; position: relative;
        }
        h1 { color: #aaa; margin-bottom: 15px; flex-shrink: 0; }
        .filters {
            display: flex; gap: 6px; margin-bottom: 0;
            flex-wrap: wrap; align-items: center; flex-shrink: 0;
            padding: 10px 16px;
            border-bottom: 1px solid #2c2c2c;
            background: #1f1f1f;
        }
        .filters button, .filters select {
            padding: 5px 12px; border: 1px solid #333; border-radius: 4px;
            background: #242424; color: #888; cursor: pointer;
            font-size: 12px; user-select: none;
            transition: background 0.12s, color 0.12s, border-color 0.12s;
            appearance: none;
        }
        .filters button:hover, .filters select:hover {
            background: #2e2e2e; color: #bbb; border-color: #444;
        }
        .filters button.active {
            background: #303030; color: #ddd; border-color: #555;
        }
        #autoClearBtn {
            padding: 5px 12px; border: 1px solid #3a3a3a; border-radius: 4px;
            background: #1a1a1a; color: #555; cursor: pointer;
            font-size: 12px; user-select: none;
            transition: background 0.12s, color 0.12s, border-color 0.12s;
            text-decoration: line-through;
        }
        #autoClearBtn:hover {
            background: #222; color: #777; border-color: #4a4a4a;
        }
        #autoClearBtn.active {
            background: #2a1515; color: #c06060; border-color: #5a2020;
            text-decoration: none;
        }
        .filters button.clear-btn {
            color: #b07070; border-color: #4a3030;
        }
        .filters button.clear-btn:hover {
            background: #2e2020; color: #cc8888; border-color: #5a3535;
        }
        .stats { font-size: 11px; color: #888; margin: 5px; flex-shrink: 0; align-self: flex-end; align-content: center; }
        .scroll-container {
            flex: 1; overflow-y: auto; position: relative;
            border-top: 1px solid #333; background: #1a1a1a; width: 100%;
        }
        .scroll-spacer { width: 100%; }
        .scroll-content { position: absolute; top: 0; left: 0; right: 0; }

        .event {
            background: #222; position: absolute; left: 0; right: 0;
            overflow: visible; border-bottom: 1px solid #333;
        }
        .event-header {
            padding: 5px 12px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            background: #282828; transition: background 0.1s;
        }
        .event-header:hover { background: #333; }
        .event-header h3 { font-size: 12px; font-weight: bold; color: #ccc; display: flex; gap: 10px; align-items: baseline; margin: 0; }
        .event-header h3 .time { color: #999; font-size: 12px; min-width: 70px; }
        .event-header h3 .type { color: #ccc; }
        .event-header h3 .desc { color: #aaa; font-weight: normal; }
        .event-header .arrow { color: #777; transition: transform 0.15s; }
        .event.open .event-header { background: #303030; }
        .event.open .event-header .arrow { transform: rotate(90deg); }
        .event-body { display: none; padding: 10px 15px; background: #1e1e1e; }
        .event.open .event-body { display: block; }
        .section { margin-bottom: 14px; }
        .section h4 { font-size: 13px; color: #aaa; margin-bottom: 4px; border-bottom: 1px solid #333; padding-bottom: 3px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; table-layout: fixed; }
        table.kv th { width: 35%; }
        table.wide-name { table-layout: auto; }
        table.wide-name th:first-child { min-width: 200px; }
        th, td { padding: 3px 8px; text-align: left; border-bottom: 1px solid #2a2a2a; }
        th { color: #999; font-weight: normal; }
        td { color: #ccc; }
        .collapsible-toggle {
            cursor: pointer; color: #aaa; font-size: 13px; display: block;
            user-select: none; margin-top: 8px; margin-bottom: 4px;
        }
        .collapsible-toggle:first-child { margin-top: 0; }
        .collapsible-toggle::before { content: '[+] '; }
        .collapsible-toggle.open::before { content: '[-] '; }
        .collapsible-content { display: none; margin-left: 10px; margin-bottom: 6px; }
        .collapsible.open + .collapsible-content { display: block; }
        .no-data { color: #666; font-style: italic; }
        .gap { margin-top: 12px; }

        /* ── Spacer trigger (sits between events, invisible until hovered) ── */
        .spacer-trigger {
            position: absolute; left: 0; right: 0; bottom: -5px; height: 10px;
            z-index: 6; cursor: pointer; background: transparent;
        }
        .spacer-trigger::after {
            content: ''; position: absolute; left: 0; right: 0;
            top: 50%; height: 0; transition: height 0.1s, background 0.1s;
        }
        .spacer-trigger:hover::after {
            height: 2px; background: rgba(109, 41, 86, 0.55);
            top: calc(50% - 1px);
        }

        /* ── Rendered spacer gap between events ── */
        .event-spacer {
            position: absolute; left: 0; right: 0;
            background: #1d1d1d;
            cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 1;
        }
        .event-spacer::after { content: '×'; color: #2a2a2a; font-size: 16px; }
        .event-spacer:hover { background: #191919; }
        .event-spacer:hover::after { color: #555; }

        /* ── Search bar ── */
        .search-bar {
            display: none; align-items: center; gap: 8px;
            padding: 6px 10px; background: #222; border: 1px solid #444;
            border-radius: 6px;
            position: absolute; top: 8px; right: 12px; z-index: 10;
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }
        .search-bar.visible { display: flex; }
        .search-bar input {
            flex: 1; padding: 5px 10px; border: 1px solid #555; border-radius: 4px;
            background: #2a2a2a; color: #ddd; font-size: 13px; outline: none;
        }
        .search-bar input:focus { border-color: #888; }
        .search-bar .search-count { font-size: 12px; color: #888; min-width: 80px; white-space: nowrap; }
        .search-bar button {
            padding: 4px 10px; border: 1px solid #555; border-radius: 4px;
            background: #2a2a2a; color: #ccc; cursor: pointer; font-size: 13px;
        }
        .search-bar button:hover { background: #444; }
        .search-bar .close-btn { color: #888; font-size: 16px; line-height: 1; padding: 2px 8px; }

        /* ── Tab navigation ── */
        .tab-bar {
            display: flex; flex-shrink: 0;
            padding: 0 12px;
            background: #1f1f1f;
            border-bottom: 1px solid #2c2c2c;
        }
        .tab-btn {
            padding: 8px 18px; background: transparent; border: none;
            border-bottom: 2px solid transparent; margin-bottom: -1px;
            color: #666; cursor: pointer; font-size: 12px; font-weight: 500;
            letter-spacing: 0.04em; text-transform: uppercase;
            transition: color 0.12s, border-color 0.12s;
        }
        .tab-btn:hover { color: #aaa; }
        .tab-btn.active { color: #ccc; border-bottom-color: #555; }





        /* ── Analytics panel ── */
        #analyticsPanel {
            display: none; flex: 1; overflow-y: auto; padding: 20px;
            background: #1a1a1a;
        }
        #analyticsPanel.visible { display: block; }

        .chart-grid {
            display: grid; grid-template-columns: 1fr;
            gap: 20px; max-width: 900px; margin: 0 auto; width: 100%;
        }
        .chart-grid-single { grid-template-columns: 1fr; }
        .chart-card {
            background: #222; border: 1px solid #333; border-radius: 8px;
            padding: 16px 20px;
        }
        .chart-card h3 {
            font-size: 13px; color: #aaa; margin-bottom: 12px;
            text-transform: uppercase; letter-spacing: 0.06em;
            border-bottom: 1px solid #333; padding-bottom: 8px;
        }
        .chart-card .chart-controls {
            display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap;
        }
        .chart-card .chart-controls label { font-size: 12px; color: #888; }
        .chart-card .chart-controls select {
            padding: 4px 10px; border: 1px solid #444; border-radius: 4px;
            background: #2a2a2a; color: #ccc; font-size: 12px; cursor: pointer;
            max-width: 220px; overflow: hidden; text-overflow: ellipsis;
        }
        .chart-canvas-wrap { position: relative; height: 260px; }
        .chart-empty {
            display: flex; align-items: center; justify-content: center;
            height: 260px; color: #555; font-size: 13px; font-style: italic;
        }
        .legend-table { width: 100%; margin-top: 12px; font-size: 12px; border-collapse: collapse; }
        .legend-table td { padding: 3px 6px; border-bottom: 1px solid #2a2a2a; }
        .legend-table .leg-color { width: 14px; height: 14px; border-radius: 3px; display: inline-block; vertical-align: middle; }
        .legend-table .leg-name { color: #ccc; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .legend-table .leg-val { color: #aaa; text-align: right; }
        .legend-table .leg-pct { color: #777; text-align: right; width: 50px; }

        /* keep log panel filling remaining space */
        #logPanel { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        #logPanel.hidden { display: none; }
    
        .event.event-reset .event-header { background: #1a1010; border-left: 3px solid #5a2020; }
        .event.event-reset .event-header h3 .type { color: #8a4040; }
        .event.event-reset .event-header h3 .desc { color: #6a3030; }
        .event.event-reset .event-header:hover { background: #221515; }
        .event.event-reset.open .event-header { background: #1e1212; }
        .event.search-match .event-header { background: #2a2a1a !important; border-left: 3px solid #a08020; }
        .event.search-match .event-header:hover { background: #333322 !important; }
        .event.search-current .event-header { background: #3a3010 !important; border-left: 3px solid #e0b030; }
        .event.search-current .event-header .time,
        .event.search-current .event-header .type,
        .event.search-current .event-header .desc { color: #f0d060 !important; }


        /* ── DmgCalc panel ──────────────────────────────────────────────────────── */
        #dmgCalcPanel {
            display: none; flex: 1; flex-direction: column; overflow: hidden;
            background: #1a1a1a;
        }
        #dmgCalcPanel.visible { display: flex; }
        
        /* Formula bar */
        .dc-formula-bar {
            flex-shrink: 0;
            background: #1f1f1f;
            border-bottom: 1px solid #2c2c2c;
            padding: 8px 12px;
            font-size: 12px;
        }
        .dc-formula-totals {
            color: #999; font-size: 12px; margin-bottom: 6px;
        }
        .dc-formula-totals strong { color: #ddd; }
        
        .dc-formula-row {
            display: flex; align-items: flex-end; gap: 0; flex-wrap: nowrap;
            overflow-x: auto; padding-bottom: 2px;
        }
        
        .dc-field-wrap {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            width: 60px; flex: 0 0 auto;
        }
        .dc-bonus-input {
            width: 100%; max-width: 72px;
            padding: 2px 4px; border: 1px solid #333; border-radius: 3px;
            background: #2a2a2a; color: #aaa; font-size: 11px;
            text-align: center; outline: none;
            -moz-appearance: textfield; appearance: textfield;
        }
        .dc-bonus-input::-webkit-outer-spin-button,
        .dc-bonus-input::-webkit-inner-spin-button { -webkit-appearance: none; }
        .dc-bonus-input:focus { border-color: #555; }
        
        .dc-field {
            display: inline-block; padding: 3px 6px;
            background: #2a2a2a; border: 1px solid #333; border-radius: 3px;
            color: #ccc; cursor: pointer; user-select: none;
            transition: background 0.1s, color 0.1s;
            white-space: nowrap; text-align: center; width: 100%; max-width: 72px;
            box-sizing: border-box;
        }
        .dc-field:hover { background: #333; color: #eee; }
        .dc-field.dc-disabled {
            text-decoration: line-through; color: #555; background: #222;
            border-color: #2a2a2a;
        }
        .dc-field.dc-display-only {
            cursor: default; border-style: dashed; color: #777; background: #232323;
        }
        .dc-field.dc-display-only:hover { background: #232323; color: #777; }
        .dc-field.dc-result-label {
            cursor: default; background: #1a1a1a; border: none; color: #aaa;
            font-weight: bold;
        }
        .dc-sep {
            color: #555; padding: 0 2px; align-self: flex-end;
            padding-bottom: 5px; flex-shrink: 0;
        }
        
        /* DC scroll area */
        .dc-scroll-wrap {
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
        }
        .dc-stats-row {
            display: flex; align-items: center; gap: 8px;
            padding: 4px 12px; background: #1f1f1f;
            border-bottom: 1px solid #2c2c2c; flex-shrink: 0;
            font-size: 11px; color: #888;
        }
        
        /* DC event rows */
        .dc-event {
            background: #222; position: absolute; left: 0; right: 0;
            border-bottom: 1px solid #2c2c2c;
        }
        .dc-event-header {
            padding: 6px 8px 6px 12px; cursor: pointer;
            display: flex; flex-direction: column; gap: 4px;
            background: #282828; transition: background 0.1s;
            position: relative;
        }
        .dc-event-header:hover { background: #303030; }
        .dc-event.open .dc-event-header { background: #2e2e2e; }
        .dc-event.open .dc-event-header .arrow { transform: rotate(90deg); }
        
        /* Top row: info text + arrow */
        .dc-header-top {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%;
        }
        .dc-header-left {
            display: flex; flex-direction: column; gap: 1px;
        }
        .dc-att-name { font-size: 11px; color: #777; font-weight: normal; }
        
        /* Fields row — full width, below the top row */
        .dc-fields-row {
            display: flex; align-items: center; gap: 0;
            width: 100%; overflow-x: auto;
        }
        .dc-field-cell {
            min-width: 73px; flex: 0 0 73px;
            text-align: center; font-size: 11px; color: #bbb; padding: 1px 2px;
        }
        .dc-field-cell.dc-disabled { color: #444; text-decoration: line-through; }
        .dc-field-cell.dc-display-only { color: #666; }
        
        .dc-result-stack {
            position: absolute;
            right: 28px; /* leave room for arrow */
            top: 0; bottom: 0;
            display: flex; flex-direction: column-reverse;
            justify-content: flex-end;
            align-items: flex-end;
            gap: 0; line-height: 1.2;
            pointer-events: none;
        }
        .dc-result-cell, .dc-game-cell, .dc-diff-cell {
            text-align: right;
            padding: 1px 4px 0; font-size: 11px;
            flex: none; line-height: 1.3; white-space: nowrap;
        }
        .dc-calc { color: #e1e1e1; font-weight: bold; }
        .dc-game { color: #9c9c9c; font-weight: bold; }
        .dc-diff-close { color: #555;    }
        .dc-diff-pos   { color: #4a7a55; }
        .dc-diff-neg   { color: #7a3838; }
        .dc-bonus-label { color: #6a9f6a; font-size: 10px; }
        
        /* PenRes compound widget in formula bar */
        .dc-penres-wrap { min-width: 60px; }
        .dc-penres-inputs {
            display: grid; grid-template-columns: auto 1fr;
            gap: 2px 4px; align-items: center; margin-bottom: 2px;
        }
        .dc-penres-label {
            font-size: 10px; color: #666; text-align: right;
            white-space: nowrap; user-select: none;
        }
        
        /* Arrow reuse */
        .dc-event-header .arrow { color: #777; transition: transform 0.15s; flex-shrink: 0; }

        /* ── Effects panel ── */
        .dc-effects-panel {
            flex-shrink: 0;
            background: #1c1c1c;
            border-bottom: 1px solid #2c2c2c;
            font-size: 12px;
        }
        .dc-effects-header {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 12px; cursor: pointer; user-select: none;
            background: #1f1f1f;
            transition: background 0.1s;
        }
        .dc-effects-header:hover { background: #252525; }
        .dc-effects-arrow {
            color: #555; font-size: 10px; transition: transform 0.15s;
            display: inline-block; flex-shrink: 0;
        }
        .dc-effects-arrow.open { transform: rotate(90deg); }
        .dc-effects-title { color: #888; font-size: 11px; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; }
        .dc-effects-count { color: #555; font-size: 11px; margin-left: auto; }
        .dc-effects-body {
            padding: 6px 10px 8px;
        }
        .dc-effects-empty { color: #555; font-style: italic; font-size: 11px; }
        .dc-effects-list { display: flex; flex-wrap: wrap; gap: 4px; }
        .dc-effects-group-label {
            width: 100%; color: #666; font-size: 10px; text-transform: uppercase;
            letter-spacing: 0.05em; padding: 2px 0; margin-top: 2px;
        }
        .dc-effects-group-label:first-child { margin-top: 0; }
        .dc-source-toggle {
            display: flex; align-items: center; gap: 5px;
            cursor: pointer; padding: 3px 4px; border-radius: 3px;
            user-select: none; transition: background 0.1s;
        }
        .dc-source-toggle:hover { background: #252525; color: #999; }
        .dc-source-arrow { font-size: 9px; color: #555; flex-shrink: 0; }
        .dc-source-count {
            margin-left: auto; background: #252525; border: 1px solid #2e2e2e;
            border-radius: 3px; padding: 0 5px; font-size: 10px; color: #555;
        }
        .dc-effects-chips-wrap {
            display: flex; flex-wrap: wrap; gap: 4px;
            padding: 4px 0 6px 12px;
        }
        .dc-effects-side-header {
            width: 100%; color: #888; font-size: 10px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.08em;
            padding: 4px 0 2px; margin-top: 6px;
            border-top: 1px solid #2c2c2c;
        }
        .dc-effects-side-header:first-child { margin-top: 0; border-top: none; }
        .dc-effect-chip {
            display: inline-flex; flex-direction: column; gap: 1px;
            padding: 3px 8px; border-radius: 4px;
            border: 1px solid #333; background: #252525;
            cursor: pointer; user-select: none;
            transition: background 0.1s, border-color 0.1s, opacity 0.1s;
        }
        .dc-effect-chip:hover { background: #2e2e2e; border-color: #444; }
        .dc-effect-chip.dc-effect-disabled {
            opacity: 0.38; background: #1e1e1e; border-color: #2a2a2a;
            text-decoration: line-through;
        }
        .dc-effect-chip.dc-effect-disabled:hover { opacity: 0.55; }
        .dc-effect-name { color: #bbb; font-size: 11px; }
        .dc-effect-stat { color: #6a9f6a; font-size: 10px; }
        .dc-effect-chip.dc-effect-disabled .dc-effect-name { color: #555; }
        .dc-effect-chip.dc-effect-disabled .dc-effect-stat { color: #4a6a4a; }

        /* ── Effect Impact panel ── */
        #eiPanel {
            display: none; flex: 1; flex-direction: column; overflow: hidden;
            background: #1a1a1a;
        }
        #eiPanel.visible { display: flex; }
        .ei-empty, .ei-loading {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: #555; font-size: 13px; font-style: italic;
        }
        .ei-header-bar {
            display: flex; align-items: center; gap: 12px; flex-shrink: 0;
            padding: 8px 16px; background: #1f1f1f;
            border-bottom: 1px solid #2c2c2c;
        }
        .ei-title { font-size: 12px; font-weight: 600; color: #bbb; letter-spacing: 0.04em; text-transform: uppercase; }
        .ei-subtitle { font-size: 11px; color: #555; }
        .ei-refresh-btn {
            margin-left: auto; padding: 4px 12px;
            border: 1px solid #333; border-radius: 4px;
            background: #242424; color: #888; font-size: 12px; cursor: pointer;
            transition: background 0.1s, color 0.1s;
        }
        .ei-refresh-btn:hover { background: #2e2e2e; color: #bbb; }

        /* Filter chip bar */
        .ei-filter-bar {
            display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: wrap;
            padding: 6px 16px; background: #1c1c1c;
            border-bottom: 1px solid #2a2a2a;
        }
        .ei-filter-label { font-size: 11px; color: #555; margin-right: 2px; flex-shrink: 0; }
        .ei-src-chip {
            padding: 3px 10px; border-radius: 3px; font-size: 11px; cursor: pointer;
            border: 1px solid transparent; user-select: none;
            transition: opacity 0.12s, border-color 0.12s, background 0.12s;
            opacity: 0.35;
        }
        .ei-src-chip.ei-chip-active { opacity: 1; }
        .ei-src-chip.ei-chip-atk {
            background: #1b2633; color: #6a9fd8; border-color: #253345;
        }
        .ei-src-chip.ei-chip-atk.ei-chip-active { border-color: #3a5a7a; }
        .ei-src-chip.ei-chip-def {
            background: #261b26; color: #c06a8a; border-color: #3a253a;
        }
        .ei-src-chip.ei-chip-def.ei-chip-active { border-color: #6a3a5a; }
        .ei-src-chip:hover { opacity: 1; }
        .ei-chip-all {
            padding: 3px 10px; border-radius: 3px; font-size: 11px; cursor: pointer;
            border: 1px solid #333; background: #242424; color: #666;
            transition: color 0.12s, border-color 0.12s;
        }
        .ei-chip-all:hover { color: #aaa; border-color: #555; }

        .ei-scroll-wrap { flex: 1; overflow-y: auto; overflow-x: auto; }
        .ei-table {
            width: 100%; border-collapse: collapse; font-size: 12px;
            min-width: 700px;
        }
        .ei-table thead { position: sticky; top: 0; z-index: 2; }
        .ei-th {
            padding: 7px 10px; text-align: left;
            background: #222; color: #777; font-weight: 500;
            border-bottom: 1px solid #333;
            white-space: nowrap; user-select: none;
        }
        .ei-th[onclick] { cursor: pointer; }
        .ei-th[onclick]:hover { color: #aaa; background: #282828; }
        .ei-th-num { text-align: right; }
        .ei-th-side { width: 38px; }
        .ei-th-source { width: 9%; }
        .ei-th-name { width: 32%; }
        .ei-th-stat { width: 18%; }
        .ei-sort-arrow { margin-left: 4px; color: #888; font-size: 10px; }
        .ei-sort-inactive { color: #3a3a3a; }

        .ei-row { border-bottom: 1px solid #252525; transition: background 0.08s; }
        .ei-row:hover { background: #262626; }
        .ei-td { padding: 6px 10px; vertical-align: middle; color: #bbb; }
        .ei-td-num { text-align: right; }
        .ei-td-side { padding: 6px 6px; }
        .ei-td-stat { white-space: nowrap; }

        /* Source column cell — spans all rows of group */
        .ei-td-source {
            vertical-align: top; padding: 8px 8px 8px 10px;
            border-right: 1px solid #252525;
            background: #1d1d1d;
        }
        .ei-source-name {
            display: block; font-size: 10px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.06em;
            line-height: 1.4; word-break: break-word;
        }
        .ei-src-atk { color: #4a7aaa; }
        .ei-src-def { color: #aa4a6a; }
        .ei-src-chip.ei-chip-src {
            background: #202428; color: #8a9aaa; border-color: #2e3540;
        }
        .ei-src-chip.ei-chip-src.ei-chip-active { border-color: #4a5a70; }
        .ei-added-badge {
            display: inline-block; font-size: 9px; font-weight: 700;
            background: #1a3020; color: #4abf7a; border: 1px solid #2a5a3a;
            border-radius: 3px; padding: 0 4px; margin-left: 5px;
            vertical-align: middle; letter-spacing: 0.04em;
        }


        .ei-side-badge {
            display: inline-block; padding: 1px 5px; border-radius: 3px;
            font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
        }
        .ei-side-atk { background: #282828; color: #959595; border: 1px solid #4d4d4d; }
        .ei-side-def { background: #282828; color: #959595; border: 1px solid #4d4d4d; }
        .ei-attr { color: #aaa; margin-right: 4px; }
        .ei-val { color: #6a9f6a; font-size: 11px; }
        .ei-stacks {
            color: #ababab; font-size: 10px; font-weight: 600;
            background: #1f1f1f; border: 1px solid #383838;
            border-radius: 3px; padding: 0 4px; margin-left: 3px;
        }
        .ei-pos  { color: #6abf7a; }
        .ei-neg  { color: #bf6a6a; }
        .ei-neutral { color: #666; }
        .ei-bold { font-weight: 600; }
        .ei-muted { color: #555; font-size: 11px; }
        .ei-cov-wrap { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
        .ei-cov-hits { color: #555; font-size: 10px; }
        .ei-cov-bar-bg {
            width: 60px; height: 3px; background: #2a2a2a; border-radius: 2px; overflow: hidden;
        }
        .ei-cov-bar-fill { height: 100%; background: #4a7a5a; border-radius: 2px; }
        .ei-empty-row { text-align: center; color: #555; padding: 20px; font-style: italic; }

        /* ── Crit Distribution card ── */
        .cd-summary {
            display: flex; gap: 20px; padding: 8px 4px 10px;
            border-bottom: 1px solid #2c2c2c; margin-bottom: 8px;
            font-size: 12px; color: #aaa; flex-wrap: wrap;
        }
        .cd-summary-item strong { font-weight: 600; }
        .cd-table {
            width: 100%; border-collapse: collapse; font-size: 12px;
        }
        .cd-th {
            padding: 5px 8px; text-align: left; color: #777;
            font-weight: normal; border-bottom: 1px solid #333;
            font-size: 11px;
        }
        .cd-th-pct { width: 90px; }
        .cd-th-dmg { text-align: right; }
        .cd-th-vs  { text-align: right; width: 90px; }
        .cd-td {
            padding: 4px 8px; border-bottom: 1px solid #252525;
            color: #bbb;
        }
        .cd-td-dmg { text-align: right; font-variant-numeric: tabular-nums; }
        .cd-td-vs  { text-align: right; font-size: 11px; }
        .cd-td-expected { color: #ddd; font-weight: 600; }
        .cd-row-expected td { color: #ddd; background: #222; }
        .cd-bar-wrap {
            display: flex; align-items: center; gap: 6px;
            padding: 10px 4px 4px; margin-top: 6px;
        }
        .cd-bar-label { font-size: 9px; color: #555; white-space: nowrap; }
        .cd-bar-track {
            flex: 1; height: 6px; position: relative;
            background: #2a2a2a; border-radius: 3px; overflow: visible;
        }
        .cd-bar-fill {
            height: 100%; border-radius: 3px;
            transition: width 0.2s;
        }
        .cd-bar-marker {
            position: absolute; top: -3px; width: 2px; height: 12px;
            background: #fff; border-radius: 1px;
            transform: translateX(-1px);
        }
        .cd-bar-label-marker {
            position: absolute; top: -16px;
            transform: translateX(-50%);
            font-size: 9px; font-weight: 600; white-space: nowrap;
        }
        .cd-row-actual td { border-bottom: 1px solid #3a3a3a; background: #1e1e1e; }
        .cd-bar-tick {
            position: absolute; top: -1px; width: 1px; height: 8px;
            background: #444; transform: translateX(-0.5px);
        }
    </style>
</head>
<body>
<div class="page">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #2c2c2c; background:#1f1f1f; flex-shrink:0;">
        <h1 style="margin:0; font-size:16px; color:#aaa; font-weight:500; letter-spacing:0.04em;">Stella Sora Combat Log Viewer</h1>
        <div style="display:flex; gap:6px; align-items:center;">
            <button id="autoClearBtn" onclick="toggleAutoClear()">Auto Clear</button>
            <select id="savedLogFilter" onchange="onSavedLogChange()" style="padding:5px 12px; border:1px solid #333; border-radius:4px; background:#242424; color:#888; font-size:12px; cursor:pointer; appearance:none; width: 200px;">
                <option value="">Live</option>
            </select>
            <button id="saveLogBtn" onclick="saveLog()" style="padding:5px 12px; border:1px solid #333; border-radius:4px; background:#242424; color:#888; font-size:12px; cursor:pointer;">Save Log</button>
            <button class="clear-btn" id="clearLogBtn" onclick="clearLog()" style="padding:5px 12px; border:1px solid #4a3030; border-radius:4px; background:#242424; color:#b07070; font-size:12px; cursor:pointer;">Clear Log</button>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" id="tabLog" onclick="switchTab('log')">Log</button>
        <button class="tab-btn" id="tabAnalytics" onclick="switchTab('analytics')">Analytics</button>
        <button class="tab-btn" id="tabDmgCalc" onclick="switchTab('dmgcalc')">Dmg Calc</button>
        <button class="tab-btn" id="tabEffectImpact" onclick="switchTab('effectimpact')">Effect Impact</button>
    </div>


    <div id="logPanel">

        <div class="filters">
            <button class="type-filter-btn active" data-type="Hit" onclick="toggleTypeFilter(this)">Hits</button>
            <button class="type-filter-btn" data-type="Buff" onclick="toggleTypeFilter(this)">Buffs</button>
            <button class="type-filter-btn" data-type="Effect" onclick="toggleTypeFilter(this)">Effects</button>
            <button class="type-filter-btn active" data-type="Skill Cast" onclick="toggleTypeFilter(this)">Skill Casts</button>
            <div style="display:flex; gap:6px; flex:1; min-width:0;">
                <select id="charFilter" onchange="onCharFilterChange()" style="flex:1; min-width:0;">
                    <option value="">All Characters</option>
                </select>
                <select id="skillFilter" onchange="onSkillFilterChange()" style="flex:1; min-width:0;">
                    <option value="">All Skills</option>
                </select>
                <select id="defenderFilter" onchange="onDefenderFilterChange()" style="flex:1; min-width:0;">
                    <option value="">All Defenders</option>
                </select>
            </div>
        </div>
        <div class="stats" id="stats"></div>
        <div class="search-bar" id="searchBar">
            <input type="text" id="searchInput" placeholder="Search events… (Ctrl+F)" autocomplete="off" spellcheck="false">
            <span class="search-count" id="searchCount"></span>
            <button onclick="navigateSearch(-1)" title="Previous (Shift+Enter)">▲</button>
            <button onclick="navigateSearch(1)" title="Next (Enter)">▼</button>
            <button class="close-btn" onclick="closeSearch()" title="Close (Esc)">✕</button>
        </div>
        <div class="scroll-container" id="scrollContainer">
            <div class="scroll-spacer" id="scrollSpacer"></div>
            <div class="scroll-content" id="scrollContent"></div>
        </div>
    </div>

    <div id="analyticsPanel">
        <div class="chart-grid chart-grid-single">

            <!-- ── Chart 1: Damage Share ── -->
            <div class="chart-card">
                <h3>Damage Share</h3>
                <div class="chart-controls" style="flex-wrap:wrap; row-gap:6px;">
                    <label>Group by:</label>
                    <select id="dsGroupBy" onchange="Analytics.refreshDmgShareChart()">
                        <option value="char">Character</option>
                        <option value="dmgtype">Damage Type</option>
                    </select>

                    <label style="margin-left:8px">Granularity:</label>
                    <select id="dsGranularity" onchange="Analytics.refreshDmgShareChart()">
                        <option value="none">—</option>
                        <option value="skill">› Skill</option>
                        <option value="hit">› Skill › Hit #</option>
                    </select>

                    <label style="margin-left:8px">Metric:</label>
                    <select id="dsMetric" onchange="Analytics.refreshDmgShareChart()">
                        <option value="dmg">Damage</option>
                        <option value="multiplier">Base Multiplier</option>
                        <option value="hits">Hit Count</option>
                    </select>

                    <div style="width:100%; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                        <label>Filter char:</label>
                        <select id="dsFilterChar" onchange="Analytics.refreshDmgShareChart()">
                            <option value="">All</option>
                        </select>

                        <label style="margin-left:8px">Filter type:</label>
                        <select id="dsFilterType" onchange="Analytics.refreshDmgShareChart()">
                            <option value="">All</option>
                        </select>

                        <label style="margin-left:8px">Filter defender:</label>
                        <select id="dsFilterDefender" onchange="Analytics.refreshDmgShareChart()">
                            <option value="">All</option>
                        </select>

                        <label style="margin-left:8px">Sort by:</label>
                        <select id="dsSort" onchange="Analytics.refreshDmgShareChart()">
                            <option value="value">Metric</option>
                            <option value="char">Character</option>
                            <option value="dmgtype">Damage Type</option>
                            <option value="skill">Skill Name</option>
                        </select>
                    </div>
                </div>
                <div class="chart-canvas-wrap" style="height:320px">
                    <canvas id="chartDmgShare"></canvas>
                </div>
                <table class="legend-table" id="legendDmgShare"></table>
            </div>

            <!-- ── Chart 2: Buff / Effect Presence ── -->
            <div class="chart-card">
                <h3>Buff / Effect Presence on Hits</h3>
                <div class="chart-controls" style="flex-wrap:wrap; row-gap:6px;">
                    <label>View by:</label>
                    <select id="bpViewBy" onchange="Analytics.onBpViewByChange()">
                        <option value="skill">Skill Hit</option>
                        <option value="buff">Buff / Effect</option>
                    </select>

                    <label style="margin-left:8px">Pick:</label>
                    <select id="bpPick" onchange="Analytics.refreshBuffChart()">
                        <option value="">—</option>
                    </select>

                    <label style="margin-left:8px">Show:</label>
                    <button id="bpToggleAB" class="bp-src-btn" data-src="attackerBuffs" onclick="Analytics.onBpSrcToggle(this)" style="padding:4px 10px;border:1px solid #444;border-radius:4px;background:#2a2a2a;color:#6a9fd8;font-size:12px;cursor:pointer;opacity:0.45;transition:opacity .15s">Att. Buffs</button>
                    <button id="bpToggleAE" class="bp-src-btn" data-src="attackerEffects" onclick="Analytics.onBpSrcToggle(this)" style="padding:4px 10px;border:1px solid #444;border-radius:4px;background:#2a2a2a;color:#d4a84b;font-size:12px;cursor:pointer;opacity:1;transition:opacity .15s">Att. Effects</button>
                    <button id="bpToggleDB" class="bp-src-btn" data-src="defenderBuffs" onclick="Analytics.onBpSrcToggle(this)" style="padding:4px 10px;border:1px solid #444;border-radius:4px;background:#2a2a2a;color:#c0605a;font-size:12px;cursor:pointer;opacity:0.45;transition:opacity .15s">Def. Buffs</button>
                    <button id="bpToggleDE" class="bp-src-btn" data-src="defenderEffects" onclick="Analytics.onBpSrcToggle(this)" style="padding:4px 10px;border:1px solid #444;border-radius:4px;background:#2a2a2a;color:#8c4ba0;font-size:12px;cursor:pointer;opacity:1;transition:opacity .15s">Def. Effects</button>
                    <button id="bpToggleAA" class="bp-src-btn" data-src="attackerAttrDict" onclick="Analytics.onBpSrcToggle(this)" style="padding:4px 10px;border:1px solid #444;border-radius:4px;background:#2a2a2a;color:#5abf8a;font-size:12px;cursor:pointer;opacity:1;transition:opacity .15s">Att. Attrs</button>
                    <button id="bpToggleDA" class="bp-src-btn" data-src="defenderAttrDict" onclick="Analytics.onBpSrcToggle(this)" style="padding:4px 10px;border:1px solid #444;border-radius:4px;background:#2a2a2a;color:#bf855a;font-size:12px;cursor:pointer;opacity:1;transition:opacity .15s">Def. Attrs</button>

                    <label style="margin-left:8px">Character:</label>
                    <select id="bpFilterChar" onchange="Analytics.onBpViewByChange()">
                        <option value="">All</option>
                    </select>
                    
                    <label style="margin-left:8px">Filter defender:</label>
                    <select id="bpFilterDefender" onchange="Analytics.onBpViewByChange()">
                        <option value="">All</option>
                    </select>
                </div>
                <div class="chart-canvas-wrap" style="height:320px; overflow-y:auto;">
                    <canvas id="chartBuff"></canvas>
                </div>
            </div>

            <!-- ── Chart 3: Crit Distribution ── -->
            <div class="chart-card">
                <h3>Crit Distribution</h3>
                <div class="chart-controls" style="flex-wrap:wrap; row-gap:6px;">
                    <label>Character:</label>
                    <select id="cdFilterChar" onchange="Analytics.refreshCritDist()">
                        <option value="">All</option>
                    </select>
                </div>
                <div id="critDistTable" style="font-size:12px;min-height:100px;">
                    <div class="chart-empty">No player hit data</div>
                </div>
            </div>

        </div>
    </div>

    <div id="dmgCalcPanel">
        <div class="filters" id="dcFilters">
            <div style="display:flex; gap:6px; flex:1; min-width:0;">
                <select id="dcCharFilter" onchange="dcOnCharFilterChange()" style="flex:1; min-width:0;">
                    <option value="">All Characters</option>
                </select>
                <select id="dcSkillFilter" onchange="dcOnSkillFilterChange()" style="flex:1; min-width:0;">
                    <option value="">All Skills</option>
                </select>
                <select id="dcDefenderFilter" onchange="dcOnDefenderFilterChange()" style="flex:1; min-width:0;">
                    <option value="">All Defenders</option>
                </select>
            </div>
        </div>
        <div class="dc-effects-panel" id="dcEffectsPanel">
            <!-- rendered by renderEffectsPanel() -->
        </div>
        <div class="dc-formula-bar" id="dcFormulaBar">
            <!-- rendered by renderFormulaBar() -->
        </div>
        <div class="dc-stats-row">
            <span id="dcStats">0 hits</span>
        </div>
        <div class="dc-scroll-wrap">
            <div class="scroll-container" id="dcScrollContainer">
                <div class="scroll-spacer" id="dcScrollSpacer"></div>
                <div class="scroll-content" id="dcScrollContent"></div>
            </div>
        </div>
    </div>


    <div id="eiPanel">
        <!-- rendered by effectImpact.js -->
    </div>

    <script src="tableResolver.js"></script>
    <script src="dataLoader.js"></script>
    <script src="log.js"></script>
    <script src="analytics.js"></script>
    <script src="dmgCalc.calc.js"></script>
    <script src="dmgCalc.ui.js"></script>
    <script src="effectImpact.js"></script>
</div>
</body>
</html>
