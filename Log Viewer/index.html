    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #161616; color: #ddd; height: 100vh; display: flex; flex-direction: column; overflow: hidden; align-items: center; }
        .page {
            max-width: 1050px; width: 100%; height: 100%; display: flex;
            flex-direction: column; background: #1a1a1a; margin: 0 auto; position: relative;
        }
        h1 { color: #aaa; margin-bottom: 15px; flex-shrink: 0; }
        .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
        .filters button, .filters select {
            padding: 6px 14px; border: 1px solid #555; border-radius: 4px; background: #2a2a2a; color: #ccc;
            cursor: pointer; font-weight: normal; transition: background 0.15s; font-size: 14px; user-select: none;
        }
        .filters button.active { background: #5a5a5a; color: #fff; }
        .filters button:hover, .filters select:hover { background: #444; }
        .filters select { width: 160px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
        .filters button.clear-btn { background: #301818; color: #cdb1b1; border-color: #533939; }
        .filters button.clear-btn:hover { background: #562a2a; }
        .stats { font-size: 11px; color: #888; margin-bottom: 10px; flex-shrink: 0; }
        .scroll-container {
            flex: 1; overflow-y: auto; position: relative;
            border-top: 1px solid #333; background: #1a1a1a; width: 100%;
        }
        .scroll-spacer { width: 100%; }
        .scroll-content { position: absolute; top: 0; left: 0; right: 0; }

        .event {
            background: #222; position: absolute; left: 0; right: 0;
            overflow: visible; border-bottom: 1px solid #333;
        }
        .event-header {
            padding: 5px 12px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            background: #282828; transition: background 0.1s;
        }
        .event-header:hover { background: #333; }
        .event-header h3 { font-size: 12px; font-weight: bold; color: #ccc; display: flex; gap: 10px; align-items: baseline; margin: 0; }
        .event-header h3 .time { color: #999; font-size: 12px; min-width: 70px; }
        .event-header h3 .type { color: #ccc; }
        .event-header h3 .desc { color: #aaa; font-weight: normal; }
        .event-header .arrow { color: #777; transition: transform 0.15s; }
        .event.open .event-header { background: #303030; }
        .event.open .event-header .arrow { transform: rotate(90deg); }
        .event-body { display: none; padding: 10px 15px; background: #1e1e1e; }
        .event.open .event-body { display: block; }
        .section { margin-bottom: 14px; }
        .section h4 { font-size: 13px; color: #aaa; margin-bottom: 4px; border-bottom: 1px solid #333; padding-bottom: 3px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; table-layout: fixed; }
        table.kv th { width: 35%; }
        th, td { padding: 3px 8px; text-align: left; border-bottom: 1px solid #2a2a2a; }
        th { color: #999; font-weight: normal; }
        td { color: #ccc; }
        .collapsible-toggle {
            cursor: pointer; color: #aaa; font-size: 13px; display: block;
            user-select: none; margin-top: 8px; margin-bottom: 4px;
        }
        .collapsible-toggle:first-child { margin-top: 0; }
        .collapsible-toggle::before { content: '[+] '; }
        .collapsible-toggle.open::before { content: '[-] '; }
        .collapsible-content { display: none; margin-left: 10px; margin-bottom: 6px; }
        .collapsible.open + .collapsible-content { display: block; }
        .no-data { color: #666; font-style: italic; }
        .gap { margin-top: 12px; }

        /* ── Spacer trigger (sits between events, invisible until hovered) ── */
        .spacer-trigger {
            position: absolute; left: 0; right: 0; bottom: -5px; height: 10px;
            z-index: 6; cursor: pointer; background: transparent;
        }
        .spacer-trigger::after {
            content: ''; position: absolute; left: 0; right: 0;
            top: 50%; height: 0; transition: height 0.1s, background 0.1s;
        }
        .spacer-trigger:hover::after {
            height: 2px; background: rgba(109, 41, 86, 0.55);
            top: calc(50% - 1px);
        }

        /* ── Rendered spacer gap between events ── */
        .event-spacer {
            position: absolute; left: 0; right: 0;
            background: #1d1d1d;
            cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 1;
        }
        .event-spacer::after { content: '×'; color: #2a2a2a; font-size: 16px; }
        .event-spacer:hover { background: #191919; }
        .event-spacer:hover::after { color: #555; }

        /* ── Search bar ── */
        .search-bar {
            display: none; align-items: center; gap: 8px;
            padding: 6px 10px; background: #222; border: 1px solid #444;
            border-radius: 6px;
            position: absolute; top: 8px; right: 12px; z-index: 10;
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }
        .search-bar.visible { display: flex; }
        .search-bar input {
            flex: 1; padding: 5px 10px; border: 1px solid #555; border-radius: 4px;
            background: #2a2a2a; color: #ddd; font-size: 13px; outline: none;
        }
        .search-bar input:focus { border-color: #888; }
        .search-bar .search-count { font-size: 12px; color: #888; min-width: 80px; white-space: nowrap; }
        .search-bar button {
            padding: 4px 10px; border: 1px solid #555; border-radius: 4px;
            background: #2a2a2a; color: #ccc; cursor: pointer; font-size: 13px;
        }
        .search-bar button:hover { background: #444; }
        .search-bar .close-btn { color: #888; font-size: 16px; line-height: 1; padding: 2px 8px; }

        /* ── Tab navigation ── */
        .tab-bar {
            display: flex; gap: 0; flex-shrink: 0;
            border-bottom: 2px solid #333; margin-bottom: 0;
        }
        .tab-btn {
            padding: 8px 22px; background: transparent; border: none;
            color: #888; cursor: pointer; font-size: 13px; font-weight: 600;
            border-bottom: 2px solid transparent; margin-bottom: -2px;
            transition: color 0.15s, border-color 0.15s; letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .tab-btn:hover { color: #bbb; }
        .tab-btn.active { color: #ddd; border-bottom-color: #a060c0; }

        /* ── Analytics panel ── */
        #analyticsPanel {
            display: none; flex: 1; overflow-y: auto; padding: 20px;
            background: #1a1a1a;
        }
        #analyticsPanel.visible { display: block; }

        .chart-grid {
            display: grid; grid-template-columns: 1fr;
            gap: 20px; max-width: 900px; margin: 0 auto; width: 100%;
        }
        .chart-grid-single { grid-template-columns: 1fr; }
        .chart-card {
            background: #222; border: 1px solid #333; border-radius: 8px;
            padding: 16px 20px;
        }
        .chart-card h3 {
            font-size: 13px; color: #aaa; margin-bottom: 12px;
            text-transform: uppercase; letter-spacing: 0.06em;
            border-bottom: 1px solid #333; padding-bottom: 8px;
        }
        .chart-card .chart-controls {
            display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap;
        }
        .chart-card .chart-controls label { font-size: 12px; color: #888; }
        .chart-card .chart-controls select {
            padding: 4px 10px; border: 1px solid #444; border-radius: 4px;
            background: #2a2a2a; color: #ccc; font-size: 12px; cursor: pointer;
            max-width: 220px; overflow: hidden; text-overflow: ellipsis;
        }
        .chart-canvas-wrap { position: relative; height: 260px; }
        .chart-empty {
            display: flex; align-items: center; justify-content: center;
            height: 260px; color: #555; font-size: 13px; font-style: italic;
        }
        .legend-table { width: 100%; margin-top: 12px; font-size: 12px; border-collapse: collapse; }
        .legend-table td { padding: 3px 6px; border-bottom: 1px solid #2a2a2a; }
        .legend-table .leg-color { width: 14px; height: 14px; border-radius: 3px; display: inline-block; vertical-align: middle; }
        .legend-table .leg-name { color: #ccc; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .legend-table .leg-val { color: #aaa; text-align: right; }
        .legend-table .leg-pct { color: #777; text-align: right; width: 50px; }

        /* keep log panel filling remaining space */
        #logPanel { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        #logPanel.hidden { display: none; }
    
        .event.search-match .event-header { background: #2a2a1a !important; border-left: 3px solid #a08020; }
        .event.search-match .event-header:hover { background: #333322 !important; }
        .event.search-current .event-header { background: #3a3010 !important; border-left: 3px solid #e0b030; }
        .event.search-current .event-header .time,
        .event.search-current .event-header .type,
        .event.search-current .event-header .desc { color: #f0d060 !important; }
    </style>
</head>
<body>
<div class="page">
    <h1>SS Combat Log Viewer</h1>
    <div class="filters">
        <button class="active" onclick="filter('all')">All</button>
        <button onclick="filter('Hit')">Hits</button>
        <button onclick="filter('Buff')">Buffs</button>
        <button onclick="filter('Effect')">Effects</button>
        <button onclick="filter('Skill Cast')">Skill Casts</button>
        <select id="charFilter" onchange="onCharFilterChange()">
            <option value="">All Characters</option>
        </select>
        <select id="skillFilter" onchange="onSkillFilterChange()">
            <option value="">All Skills</option>
        </select>
        <select id="defenderFilter" onchange="onDefenderFilterChange()">
            <option value="">All Defenders</option>
        </select>
        <br>
        <select id="savedLogFilter" onchange="onSavedLogChange()">
            <option value="">Live</option>
        </select>
        <button id="saveLogBtn" onclick="saveLog()">Save Log</button>
        <button class="clear-btn" id="clearLogBtn" onclick="clearLog()">Clear Log</button>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" id="tabLog" onclick="switchTab('log')">Log</button>
        <button class="tab-btn" id="tabAnalytics" onclick="switchTab('analytics')">Analytics</button>
    </div>

    <div id="logPanel">
        <div class="stats" id="stats"></div>
        <div class="search-bar" id="searchBar">
            <input type="text" id="searchInput" placeholder="Search events… (Ctrl+F)" autocomplete="off" spellcheck="false">
            <span class="search-count" id="searchCount"></span>
            <button onclick="navigateSearch(-1)" title="Previous (Shift+Enter)">▲</button>
            <button onclick="navigateSearch(1)" title="Next (Enter)">▼</button>
            <button class="close-btn" onclick="closeSearch()" title="Close (Esc)">✕</button>
        </div>
        <div class="scroll-container" id="scrollContainer">
            <div class="scroll-spacer" id="scrollSpacer"></div>
            <div class="scroll-content" id="scrollContent"></div>
        </div>
    </div>

    <div id="analyticsPanel">
        <div class="chart-grid chart-grid-single">

            <!-- ── Chart 1: Damage Share ── -->
            <div class="chart-card">
                <h3>Damage Share</h3>
                <div class="chart-controls" style="flex-wrap:wrap; row-gap:6px;">
                    <label>Group by:</label>
                    <select id="dsGroupBy" onchange="Analytics.refreshDmgShareChart()">
                        <option value="char">Character</option>
                        <option value="dmgtype">Damage Type</option>
                    </select>

                    <label style="margin-left:8px">Granularity:</label>
                    <select id="dsGranularity" onchange="Analytics.refreshDmgShareChart()">
                        <option value="none">—</option>
                        <option value="skill">› Skill</option>
                        <option value="hit">› Skill › Hit #</option>
                    </select>

                    <label style="margin-left:8px">Metric:</label>
                    <select id="dsMetric" onchange="Analytics.refreshDmgShareChart()">
                        <option value="dmg">Damage</option>
                        <option value="multiplier">Base Multiplier</option>
                        <option value="hits">Hit Count</option>
                    </select>

                    <div style="width:100%; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                        <label>Filter char:</label>
                        <select id="dsFilterChar" onchange="Analytics.refreshDmgShareChart()">
                            <option value="">All</option>
                        </select>

                        <label style="margin-left:8px">Filter type:</label>
                        <select id="dsFilterType" onchange="Analytics.refreshDmgShareChart()">
                            <option value="">All</option>
                        </select>

                        <label style="margin-left:8px">Filter defender:</label>
                        <select id="dsFilterDefender" onchange="Analytics.refreshDmgShareChart()">
                            <option value="">All</option>
                        </select>

                        <label style="margin-left:8px">Sort by:</label>
                        <select id="dsSort" onchange="Analytics.refreshDmgShareChart()">
                            <option value="value">Metric</option>
                            <option value="char">Character</option>
                            <option value="dmgtype">Damage Type</option>
                            <option value="skill">Skill Name</option>
                        </select>
                    </div>
                </div>
                <div class="chart-canvas-wrap" style="height:320px">
                    <canvas id="chartDmgShare"></canvas>
                </div>
                <table class="legend-table" id="legendDmgShare"></table>
            </div>

            <!-- ── Chart 2: Buff / Effect Presence ── -->
            <div class="chart-card">
                <h3>Buff / Effect Presence on Hits</h3>
                <div class="chart-controls" style="flex-wrap:wrap; row-gap:6px;">
                    <label>View by:</label>
                    <select id="bpViewBy" onchange="Analytics.onBpViewByChange()">
                        <option value="skill">Skill Hit</option>
                        <option value="buff">Buff / Effect</option>
                    </select>

                    <label style="margin-left:8px">Pick:</label>
                    <select id="bpPick" onchange="Analytics.refreshBuffChart()">
                        <option value="">—</option>
                    </select>

                    <label style="margin-left:8px">Show:</label>
                    <button id="bpToggleAB" class="bp-src-btn" data-src="attackerBuffs" onclick="Analytics.onBpSrcToggle(this)" style="padding:4px 10px;border:1px solid #444;border-radius:4px;background:#2a2a2a;color:#6a9fd8;font-size:12px;cursor:pointer;opacity:0.45;transition:opacity .15s">Att. Buffs</button>
                    <button id="bpToggleAE" class="bp-src-btn" data-src="attackerEffects" onclick="Analytics.onBpSrcToggle(this)" style="padding:4px 10px;border:1px solid #444;border-radius:4px;background:#2a2a2a;color:#d4a84b;font-size:12px;cursor:pointer;opacity:1;transition:opacity .15s">Att. Effects</button>
                    <button id="bpToggleDB" class="bp-src-btn" data-src="defenderBuffs" onclick="Analytics.onBpSrcToggle(this)" style="padding:4px 10px;border:1px solid #444;border-radius:4px;background:#2a2a2a;color:#c0605a;font-size:12px;cursor:pointer;opacity:0.45;transition:opacity .15s">Def. Buffs</button>
                    <button id="bpToggleDE" class="bp-src-btn" data-src="defenderEffects" onclick="Analytics.onBpSrcToggle(this)" style="padding:4px 10px;border:1px solid #444;border-radius:4px;background:#2a2a2a;color:#8c4ba0;font-size:12px;cursor:pointer;opacity:1;transition:opacity .15s">Def. Effects</button>
                    <button id="bpToggleAA" class="bp-src-btn" data-src="attackerAttrDict" onclick="Analytics.onBpSrcToggle(this)" style="padding:4px 10px;border:1px solid #444;border-radius:4px;background:#2a2a2a;color:#5abf8a;font-size:12px;cursor:pointer;opacity:1;transition:opacity .15s">Att. Attrs</button>
                    <button id="bpToggleDA" class="bp-src-btn" data-src="defenderAttrDict" onclick="Analytics.onBpSrcToggle(this)" style="padding:4px 10px;border:1px solid #444;border-radius:4px;background:#2a2a2a;color:#bf855a;font-size:12px;cursor:pointer;opacity:1;transition:opacity .15s">Def. Attrs</button>

                    <label style="margin-left:8px">Character:</label>
                    <select id="bpFilterChar" onchange="Analytics.onBpViewByChange()">
                        <option value="">All</option>
                    </select>
                </div>
                <div class="chart-canvas-wrap" style="height:320px; overflow-y:auto;">
                    <canvas id="chartBuff"></canvas>
                </div>
            </div>

        </div>
    </div>

    <script src="tableResolver.js"></script>
    <script src="dataLoader.js"></script>
    <script src="log.js"></script>
    <script src="analytics.js"></script>
</div>
</body>
</html>
